name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  # Primary attempt
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force a true database write via PATCH
        run: |
          curl -X PATCH "https://axzeizuraxnkologrdtn.supabase.co/rest/v1/keep_alive?pinged_at=not.is.null" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{"pinged_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}'

  # First backup (Runs only if primary fails)
  ping_supabase_backup_1:
    needs: ping_supabase
    if: failure()
    runs-on: windows-latest
    steps:
      - name: Force a true database write via PATCH (Windows Backup)
        shell: bash
        run: |
          curl -X PATCH "https://axzeizuraxnkologrdtn.supabase.co/rest/v1/keep_alive?pinged_at=not.is.null" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{"pinged_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}'

  # Second backup (Runs only if first backup fails)
  ping_supabase_backup_2:
    needs: ping_supabase_backup_1
    if: failure()
    runs-on: macos-latest
    steps:
      - name: Force a true database write via PATCH (Mac Backup)
        run: |
          curl -X PATCH "https://axzeizuraxnkologrdtn.supabase.co/rest/v1/keep_alive?pinged_at=not.is.null" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{"pinged_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}'
