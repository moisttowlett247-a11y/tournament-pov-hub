name: Supabase Keep Alive

on:
  schedule:
    # Runs 4 times a day (at 00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggers

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force a true database write via PATCH
        run: |
          curl -X PATCH "https://axzeizuraxnkologrdtn.supabase.co/rest/v1/keep_alive?pinged_at=not.is.null" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"pinged_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}'
