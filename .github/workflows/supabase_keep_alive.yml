name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at midnight UTC to prevent the 7-day auto-pause
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to trigger this manually anytime to test it

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force a database write via PATCH
        run: |
          curl -X POST "https://axzeizuraxnkologrdtn.supabase.co/rest/v1/keep_alive" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"id": 2}'
