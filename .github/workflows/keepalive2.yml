name: Prevent Repo Hibernation

on:
  schedule:
    # Runs once a day (much cleaner than hourly!)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      # CRITICAL: This allows the bot to reset GitHub's 60-day timer via API
      actions: write
    steps:
      - name: Reset 60-day inactivity timer
        uses: liskin/gh-workflow-keepalive@v1
